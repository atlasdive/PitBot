name: Build HypixelRecreation clientmod

on:
  push:
    branches:
      - build/hypixelrecreation-clientmod
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-clientmod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Checkout upstream source (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: Swofty-Developments/HypixelRecreation
          ref: 984e561b1061262c540edd4271ac9629f5d0166a
          path: upstream
          fetch-depth: 1
          sparse-checkout: |
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            gradle
            gradlew
            clientmod
          sparse-checkout-cone-mode: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build clientmod
        working-directory: upstream
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :clientmod:build --no-daemon --stacktrace

      - name: Verify output JAR
        shell: bash
        run: |
          JAR="upstream/clientmod/build/libs/hypixelrecreationmod-0.1.0.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -Fx "fabric.mod.json"
          echo "Built: $JAR"
          ls -lh "$JAR"

      - name: Upload clientmod JAR
        uses: actions/upload-artifact@v4
        with:
          name: hypixelrecreation-clientmod
          path: upstream/clientmod/build/libs/hypixelrecreationmod-0.1.0.jar
          if-no-files-found: error
          retention-days: 14
