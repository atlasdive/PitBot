name: Build Geode

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geode-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Forge 1.8.9 build (JDK 8 / Gradle 2.14.1)
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Install Gradle 2.14.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gradle-2.14.1-bin.zip"
          expected_sha256="cfc61eda71f2d12a572822644ce13d2919407595c2aec3e3566d2aab6f97ef39"
          downloaded=false

          # Use Gradle's direct distribution host first. The services.gradle.org
          # redirect endpoint has intermittently returned HTTP 504 in Actions.
          for url in \
            "https://downloads.gradle.org/distributions/gradle-2.14.1-bin.zip" \
            "https://services.gradle.org/distributions/gradle-2.14.1-bin.zip"; do
            rm -f "$archive"
            if curl --fail --location --retry 2 --retry-all-errors --connect-timeout 20 \
                "$url" --output "$archive"; then
              actual_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
              if [[ "$actual_sha256" != "$expected_sha256" ]]; then
                echo "Gradle distribution checksum mismatch from $url" >&2
                echo "Expected: $expected_sha256" >&2
                echo "Actual:   $actual_sha256" >&2
                exit 1
              fi
              downloaded=true
              echo "Downloaded and checksum-verified Gradle 2.14.1 from $url"
              break
            fi
            echo "Download failed from $url; trying the next official host" >&2
          done

          if [[ "$downloaded" != "true" ]]; then
            echo "Could not download Gradle 2.14.1 from either official host" >&2
            exit 1
          fi

          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Prepare Forge 1.8.9 CI workspace (no game assets)
        run: gradle --no-daemon setupCIWorkspace --stacktrace

      - name: Run unit tests and build mod
        run: gradle --no-daemon test build --stacktrace

      - name: Verify output JAR
        shell: bash
        run: |
          set -euo pipefail
          test -f build/libs/Geode-0.1.0.jar
          ls -lh build/libs/Geode-0.1.0.jar

      - name: Upload Geode JAR
        uses: actions/upload-artifact@v4
        with:
          name: Geode-Forge-1.8.9
          path: build/libs/Geode-0.1.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Geode-test-reports
          path: |
            build/test-results/test/
            build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
